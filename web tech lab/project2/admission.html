<html>
<head>
    <title>Admission Form - GCET Jammu</title>
</head>
<body>

    <header>
        <img src="logo.jpg" width= 100 alt="GCET Logo" class="logo-img">
        <div class="header-text">
            <h1>Govt. College of Engineering and Technology, Jammu</h1>
            <p>(Autonomous College)</p>
        </div>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="faculty.html">Faculty</a>
        <a href="students.html">Students</a>
        <a href="gallery.html">Gallery</a>
        <a href="admission.html" class="active">Admission</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <h2 class="page-title">Student Admission Form</h2>

        <div class="form-container">
            <form action="#" method="post">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullname">Full Name <span>*</span></label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth <span>*</span></label>
                        <input type="date" id="dob" name="dob" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email <span>*</span></label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="course">Course Applied For <span>*</span></label>
                        <select id="course" name="course" required>
                            <option value="">-- Select Course --</option>
                            <option value="cse">Computer Engineering</option>
                            <option value="ece">Electronics & Comm. Engineering</option>
                            <option value="me">Mechanical Engineering</option>
                            <option value="ce">Civil Engineering</option>
                            <option value="ee">Electrical Engineering</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number <span>*</span></label>
                        <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="address">Address <span>*</span></label>
                        <textarea id="address" name="address" rows="3" placeholder="Enter your address" required></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label>Gender <span>*</span></label>
                        <div class="radio-group">
                            <label><input type="radio" name="gender" value="male" required> Male</label>
                            <label><input type="radio" name="gender" value="female"> Female</label>
                            <label><input type="radio" name="gender" value="other"> Other</label>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">Submit</button>
                    <button type="reset" class="btn btn-secondary">Reset</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 GCET Jammu. All Rights Reserved.</p>
    </footer>

</body>
</html>
